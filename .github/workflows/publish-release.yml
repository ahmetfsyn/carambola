name: Expand v1.0.0 platforms

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag (must be v1.0.0)
        required: true
        type: string
        default: v1.0.0
      platform:
        description: Platform that has completed production-readiness testing
        required: true
        type: choice
        options:
          - macos-arm64
          - macos-x64
          - linux-x86_64

permissions:
  contents: write

jobs:
  expand:
    runs-on: ${{ inputs.platform == 'macos-arm64' && 'macos-15' || inputs.platform == 'macos-x64' && 'macos-15-intel' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.platform == 'macos-arm64' && 'aarch64-apple-darwin' || inputs.platform == 'macos-x64' && 'x86_64-apple-darwin' || '' }}
      - name: Install Linux build dependencies
        if: inputs.platform == 'linux-x86_64'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 minisign
      - name: Install macOS signature verifier
        if: startsWith(inputs.platform, 'macos-')
        run: brew install minisign
      - run: npm ci
      - name: Validate existing published release and preserve Windows entry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          test "$TAG" = "v1.0.0"
          gh release view "$TAG" --json isDraft --jq '.isDraft == false' | grep -qx true
          mkdir -p release-before
          gh release download "$TAG" --pattern latest.json --dir release-before
          jq -e '.version == "1.0.0" and .platforms["windows-x86_64"].url and .platforms["windows-x86_64"].signature' release-before/latest.json >/dev/null
          jq -cS '.platforms["windows-x86_64"]' release-before/latest.json > release-before/windows-entry.json
      - uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ inputs.tag }}
          releaseDraft: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ inputs.platform == 'macos-arm64' && '--target aarch64-apple-darwin --bundles dmg' || inputs.platform == 'macos-x64' && '--target x86_64-apple-darwin --bundles dmg' || '--target x86_64-unknown-linux-gnu --bundles appimage' }}
      - name: Verify merged manifest and new signature
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          PLATFORM: ${{ inputs.platform == 'macos-arm64' && 'darwin-aarch64' || inputs.platform == 'macos-x64' && 'darwin-x86_64' || 'linux-x86_64' }}
        shell: bash
        run: |
          mkdir -p release-after/assets
          gh release download "$TAG" --pattern latest.json --dir release-after --clobber
          jq -e --arg platform "$PLATFORM" '
            .version == "1.0.0" and
            (.platforms["windows-x86_64"].url | type == "string" and length > 0) and
            (.platforms["windows-x86_64"].signature | type == "string" and length > 0) and
            (.platforms[$platform].url | type == "string" and length > 0) and
            (.platforms[$platform].signature | type == "string" and length > 0)
          ' release-after/latest.json >/dev/null
          jq -cS '.platforms["windows-x86_64"]' release-after/latest.json > release-after/windows-entry.json
          cmp release-before/windows-entry.json release-after/windows-entry.json

          asset_url=$(jq -r --arg platform "$PLATFORM" '.platforms[$platform].url' release-after/latest.json)
          case "$asset_url" in
            https://api.github.com/repos/ahmetfsyn/carambola/releases/assets/*)
              asset_name=$(gh api "${asset_url#https://api.github.com/}" --jq .name)
              ;;
            https://github.com/ahmetfsyn/carambola/releases/download/*/*)
              asset_name="${asset_url##*/}"
              ;;
            *) echo "Unexpected updater URL: $asset_url" >&2; exit 1 ;;
          esac
          gh release download "$TAG" --pattern "$asset_name" --pattern "$asset_name.sig" --dir release-after/assets
          manifest_signature=$(jq -r --arg platform "$PLATFORM" '.platforms[$platform].signature' release-after/latest.json | tr -d '\r\n')
          asset_signature=$(tr -d '\r\n' < "release-after/assets/$asset_name.sig")
          test "$manifest_signature" = "$asset_signature"
          public_key=$(jq -r '.plugins.updater.pubkey' src-tauri/tauri.conf.json)
          printf '%s' "$public_key" | base64 --decode > release-after/updater.pub
          minisign -Vm "release-after/assets/$asset_name" -x "release-after/assets/$asset_name.sig" -p release-after/updater.pub
          sha256sum "release-after/assets/$asset_name" "release-after/assets/$asset_name.sig" release-after/latest.json
