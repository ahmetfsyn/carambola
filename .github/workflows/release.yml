name: Windows production release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Verify release metadata
        shell: pwsh
        run: |
          $expected = $env:GITHUB_REF_NAME.TrimStart('v')
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $tauri = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $cargo = Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          $cargoVersion = [regex]::Match($cargo.Line, '"([^"]+)"').Groups[1].Value
          if ($package.version -ne $expected -or $tauri.version -ne $expected -or $cargoVersion -ne $expected) {
            throw "Release tag $env:GITHUB_REF_NAME does not match package/Tauri/Cargo versions ($($package.version), $($tauri.version), $cargoVersion)."
          }
          if ($tauri.identifier -ne 'io.carambola.desktop') { throw "Unexpected app identifier: $($tauri.identifier)" }
      - id: notes
        shell: pwsh
        run: |
          "body<<RELEASE_NOTES_EOF" >> $env:GITHUB_OUTPUT
          Get-Content -Raw RELEASE_NOTES.md >> $env:GITHUB_OUTPUT
          "RELEASE_NOTES_EOF" >> $env:GITHUB_OUTPUT
      - uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Carambola ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          uploadUpdaterJson: false
          updaterJsonPreferNsis: true
          args: --target x86_64-pc-windows-msvc --bundles nsis
      - name: Generate Windows-only updater manifest from uploaded assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          $installer = 'Carambola_' + $version + '_x64-setup.exe'
          $installerPath = Join-Path 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis' $installer
          $signaturePath = "$installerPath.sig"
          if (!(Test-Path $installerPath) -or !(Test-Path $signaturePath)) { throw 'The NSIS installer or its updater signature is missing.' }

          $release = gh api "repos/ahmetfsyn/carambola/releases/tags/$env:TAG" | ConvertFrom-Json
          $asset = $release.assets | Where-Object name -eq $installer | Select-Object -First 1
          $signatureAsset = $release.assets | Where-Object name -eq "$installer.sig" | Select-Object -First 1
          if (!$asset -or !$signatureAsset) { throw 'The installer and signature must both be uploaded before creating latest.json.' }
          if ($asset.state -ne 'uploaded' -or $signatureAsset.state -ne 'uploaded') { throw 'GitHub has not completed both asset uploads.' }

          New-Item -ItemType Directory -Force -Path release-check | Out-Null
          gh release download $env:TAG --pattern $installer --pattern "$installer.sig" --dir release-check
          $localHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installerPath).Hash
          $remoteHash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path 'release-check' $installer)).Hash
          if ($localHash -ne $remoteHash) { throw 'The uploaded installer bytes do not match the locally signed build.' }
          $localSignature = (Get-Content -Raw -LiteralPath $signaturePath).Trim()
          $remoteSignature = (Get-Content -Raw -LiteralPath (Join-Path 'release-check' "$installer.sig")).Trim()
          if ($localSignature -ne $remoteSignature) { throw 'The uploaded updater signature differs from the locally generated signature.' }

          $manifest = [ordered]@{
            version = $version
            notes = (Get-Content -Raw RELEASE_NOTES.md).Trim()
            pub_date = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = $remoteSignature
                url = $asset.browser_download_url
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 latest.json
          gh release upload $env:TAG latest.json --clobber

  verify-and-publish:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Install minisign verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
      - name: Verify Windows manifest, updater signature, installer, and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          EXPECTED_VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          VERSION="${EXPECTED_VERSION#v}"
          gh release view "$TAG" --json isDraft --jq '.isDraft == true' | grep -qx true
          mkdir -p release-check/assets
          gh release download "$TAG" --pattern latest.json --dir release-check

          jq -e --arg version "$VERSION" '
            .version == $version and
            (.platforms | keys == ["windows-x86_64"]) and
            (.platforms["windows-x86_64"].url | type == "string" and length > 0) and
            (.platforms["windows-x86_64"].signature | type == "string" and length > 0)
          ' release-check/latest.json >/dev/null

          asset_url=$(jq -r '.platforms["windows-x86_64"].url' release-check/latest.json)
          case "$asset_url" in
            https://api.github.com/repos/ahmetfsyn/carambola/releases/assets/*)
              asset_name=$(gh api "${asset_url#https://api.github.com/}" --jq .name)
              ;;
            https://github.com/ahmetfsyn/carambola/releases/download/*/*)
              asset_name="${asset_url##*/}"
              ;;
            *) echo "Unexpected updater URL: $asset_url" >&2; exit 1 ;;
          esac
          case "$asset_name" in
            *-setup.exe) ;;
            *) echo "Manifest does not point to the NSIS installer: $asset_name" >&2; exit 1 ;;
          esac
          gh release download "$TAG" --pattern "$asset_name" --pattern "$asset_name.sig" --dir release-check/assets
          test -s "release-check/assets/$asset_name"
          test -s "release-check/assets/$asset_name.sig"

          manifest_signature=$(jq -r '.platforms["windows-x86_64"].signature' release-check/latest.json | tr -d '\r\n')
          asset_signature=$(tr -d '\r\n' < "release-check/assets/$asset_name.sig")
          test "$manifest_signature" = "$asset_signature"

          public_key=$(jq -r '.plugins.updater.pubkey' src-tauri/tauri.conf.json)
          printf '%s' "$public_key" | base64 --decode > release-check/updater.pub
          minisign -Vm "release-check/assets/$asset_name" -x "release-check/assets/$asset_name.sig" -p release-check/updater.pub

          file "release-check/assets/$asset_name"
          sha256sum "release-check/assets/$asset_name" "release-check/assets/$asset_name.sig" release-check/latest.json
          gh release edit "$TAG" --draft=false
