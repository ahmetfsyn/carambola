[package]
name = "carambola"
version = "0.1.1"
description = "Lightweight cross-platform screenshot and annotation application"
edition = "2021"
default-run = "carambola"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2.1", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
xcap = "0.0.9"
arboard = "3.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
dirs = "5.0"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-notification = "2.8.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Media_Ocr",
    "Graphics_Imaging",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
] }

# Wayland clipboard image support. Under X11/XWayland the default backend is
# used; on native Wayland this feature enables the data-control protocol.
[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.4", features = ["wayland-data-control"] }

# PNG encoding is the only CPU-heavy dependency on the activation path. Keep
# the dev profile interactive by optimizing just the codec crates; the rest of
# the application remains unoptimized for debugging.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.dev.package.simd-adler32]
opt-level = 3

[profile.dev.package.xcap]
opt-level = 2

# The activation path deliberately uses tight pixel loops (BGRA -> RGBA,
# clipboard cropping). Optimize this crate in dev so `tauri dev` activation
# latency tracks the release build.
[profile.dev.package.carambola]
opt-level = 2

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"
objc2 = { version = "0.6.2", default-features = false }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWindow", "NSAlert", "NSApplication", "NSButton", "NSControl", "NSResponder", "NSView", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString", "NSURL"] }
