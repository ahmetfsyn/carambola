[package]
name = "carambola"
version = "1.0.0"
edition = "2021"
publish = false
build = "build.rs"

[features]
window-diagnostics = []

[dependencies]
log = "0.4"
env_logger = "0.11"
image = { version = "0.25.10", default-features = false, features = ["png", "ico"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
    "compat-1-2",
    "system-tray",
    "raw-window-handle-06",
    "unstable-winit-030",
] }

[build-dependencies]
slint-build = "1.18.1"
cc = "1"
embed-resource = "3.0.12"

[patch.crates-io]
winit = { path = "vendor/winit-0.30.13" }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Registry",
      "Win32_System_WinRT",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Data_Xml_Dom",
    "UI_Notifications",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
arboard = "3.7.0"

[target.'cfg(target_os = "linux")'.dependencies]
arboard = "3.7.0"
